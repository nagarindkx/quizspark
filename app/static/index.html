==i?'checked':''} aria-label="${t('correctAnswer')} ${i+1}"><span style="color:${['#ff5572','#76b4ff','#ffcf59','#89d969'][i]}">${shapes[i]}</span><input data-option="${i}" maxlength="500" value="${escapeHTML(option)}" aria-label="${t('options')} ${i+1}"></label>`).join('')}</div>`:field(t('accepted'),`<input data-field="openAnswers" maxlength="10000" value="${escapeHTML(q.openAnswers.join(', '))}"><span class="muted small">${t('acceptedHint')}</span>`)}<hr class="divider">${imageEditor('image',t('image'),q.image)}${field(t('emoji'),`<input data-field="emoji" maxlength="32" value="${escapeHTML(q.emoji)}" style="max-width:140px">`)}<hr class="divider">${field(t('explanationText'),`<textarea data-field="explanationText" maxlength="5000">${escapeHTML(q.explanationText)}</textarea>`)}${imageEditor('explanationImage',t('explanationImage'),q.explanationImage)}<div id="editor-error" class="error" role="alert"></div></section></div>`);}
function safeImage(url){try{const u=new URL(url,location.origin);return (['http:','https:'].includes(u.protocol)||url.startsWith('data:image/'))?escapeHTML(url):'';}catch{return '';}}
function imageEditor(key,label,url){return `<div class="field"><label for="url-${key}">${label}</label><input id="url-${key}" data-field="${key}" placeholder="${t('imageUrl')}" value="${escapeHTML(url)}"><input type="file" data-upload="${key}" accept="image/png,image/jpeg,image/webp,image/gif" aria-label="${t('upload')}: ${label}"><span class="muted small">${t('imageLimit',{n:config.maxUploadMB})}</span>${url?`<img class="image-preview" src="${safeImage(url)}" alt="${label}">`:''}</div>`;}
async function saveQuiz(){const btn=$('[data-action="save"]');btn.disabled=true;try{const result=await api('/api/quizzes'+(draft.id?'/'+draft.id:''),{method:draft.id?'PUT':'POST',body:draft});draft=result;dirty=false;toast(t('saved'));await showQuizzes('manager');}catch(e){$('#editor-error').textContent=err(e.message);btn.disabled=false;}}
function showJoin(pin=''){view='join';mount(`<div class="narrow glass panel fade"><div class="center"><div class="eyebrow">${t('letsPlay')}</div><h2 class="space-top">${t('joinTitle')}</h2><p class="muted small space-top">${t('joinDesc')}</p></div><form id="player-join" class="stack space-top">${field(t('pin'),`<input id="player-pin" class="pin-input" value="${escapeHTML(pin)}" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required placeholder="000 000">`)}${field(t('nickname'),`<input id="nickname" maxlength="24" required autocomplete="off" placeholder="${t('nicknamePlaceholder')}">`)}<label>${t('avatar')}</label><div class="avatars">${avatars.map(a=>`<button type="button" class="avatar-btn ${a===avatar?'selected':''}" data-action="avatar" data-avatar="${a}" aria-label="${a}" aria-pressed="${a===avatar}">${a}</button>`).join('')}</div><div id="join-error" class="error" role="alert"></div><button class="btn primary full" type="submit">${t('enter')} →</button></form></div>`);}
function dropConnection(clear=true){socketGeneration++;clearTimeout(retryTimer);if(ws){ws.onclose=null;ws.close();ws=null;}if(clear){resume=null;role=null;roomState=null;sessionStorage.removeItem(resumeKey);}$('#connection').hidden=true;}
function connect(firstMessage){dropConnection(false);const generation=socketGeneration;const socket=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws');ws=socket;socket.onopen=()=>socket.send(JSON.stringify(firstMessage));socket.onmessage=e=>{if(generation!==socketGeneration)return;const message=JSON.parse(e.data);if(message.type==='connected'){lastPlayerKey='';resume={pin:message.pin,token:message.token,role:message.role};role=message.role;sessionStorage.setItem(resumeKey,JSON.stringify(resume));$('#connection').hidden=true;if(embedded&&role==='host')parent.postMessage({type:'quizspark-pin',pin:message.pin},location.origin);}else if(message.type==='state'){roomState=message.state;clockOffset=roomState.serverNow-Date.now();view='game';renderGame();}else if(message.type==='kicked'){dropConnection();showJoin();toast(t('closed'));}else if(message.type==='error'){if(firstMessage.type==='resume'&&message.code==='room_missing'){dropConnection();showHome();toast(t('serverGone'));return;}const target=$('#join-error');if(target)target.textContent=err(message.code);else toast(err(message.code));if(!resume){$$('[data-action="host-quiz"]').forEach(b=>b.disabled=false);const submit=$('#player-join button[type="submit"]');if(submit)submit.disabled=false;dropConnection();}}};socket.onclose=e=>{if(generation!==socketGeneration)return;if(e.code===4001){dropConnection();showHome();toast(t('switched'));return;}if(resume){$('#connection').textContent=t('reconnecting');$('#connection').hidden=false;retryTimer=setTimeout(()=>connect({type:'resume',...resume}),1500);}else{$$('[data-action="host-quiz"]').forEach(b=>b.disabled=false);const submit=$('#player-join button[type="submit"]');if(submit)submit.disabled=false;toast(t('networkError'));}};socket.onerror=()=>{};}
function send(message){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(message));else toast(t('reconnecting'));}
function joinUrl(){return location.origin+'/?pin='+roomState.pin;}
function publicQuestion(q){return `<h2 class="question-text">${escapeHTML(q.text)}</h2><div class="question-media"><span>${escapeHTML(q.emoji||'💡')}</span>${q.image?`<img src="${safeImage(q.image)}" alt="${t('image')}">`:''}</div>`;}
function gameTop(s){return `<div class="game-top"><span class="pill">${t('question')} ${s.index+1} / ${s.total}</span><span class="pill">${t(s.question.type==='mcq'?'mcq':'open')}</span><span class="pill">PIN ${s.pin}</span></div>`;}
function explanation(q){return q.explanationText||q.explanationImage?`<div class="explanation"><h3>✦ ${t('explanation')}</h3>${q.explanationText?`<p>${escapeHTML(q.explanationText)}</p>`:''}${q.explanationImage?`<img src="${safeImage(q.explanationImage)}" alt="${t('explanationImage')}">`:''}</div>`:'';}
function answerTiles(q,interactive=false,reveal=false){return `<div class="answers ${interactive?'player-answers':''}">${q.options.map((o,i)=>`<${interactive?'button':'div'} class="answer ${reveal?(i===q.correct?'correct':'faded'):''}" ${interactive?`data-action="answer" data-index="${i}"`:''}><span class="shape">${shapes[i]}</span><span>${escapeHTML(o)}</span>${reveal&&i===q.correct?'<span>✓</span>':''}</${interactive?'button':'div'}>`).join('')}</div>`;}
function correctLine(q){return `<div class="correct-line">✓ ${t('correctAnswer')}: ${escapeHTML(q.type==='mcq'?q.options[q.correct]:q.openAnswers.join(' / '))}</div>`;}
function leaders(s){return `<div class="leader-list">${s.players.slice(0,5).map((p,i)=>`<div class="leader-row" style="animation-delay:${i*60}ms"><span class="rank">${p.rank}</span><span class="leader-avatar">${p.avatar}</span><div class="leader-name">${escapeHTML(p.name)}${p.streak>1?`<div class="streak">🔥 ${p.streak}</div>`:''}</div><span class="score">${num(p.score)}</span></div>`).join('')}</div>`;}
function podium(s){return `<div class="center"><div class="eyebrow">${t('quizComplete')}</div><h2 class="space-top">${t('podiumTitle')}</h2><p class="muted space-top">${t('podiumDesc')}</p></div><div class="podium">${[1,0,2].map(i=>{const p=s.players[i];return p?`<div class="podium-place"><div class="person"><span>${p.avatar}</span>${escapeHTML(p.name)}</div><div class="podium-step ${['gold','silver','bronze'][i]}"><b>${['🥇','🥈','🥉'][i]}</b><strong>${num(p.score)}</strong></div></div>`:''}).join('')}</div>`;}
function renderGame(force=false){const s=roomState;if(!s)return;header();const key=s.pin+':'+s.index+':'+s.stage+':'+(s.me?.answered?'yes':'no')+':'+lang+':'+s.hostOnline;if(role==='player'&&s.stage==='question'&&key===lastPlayerKey&&!force){updateTimer();return;}if(s.stage==='closed'){dropConnection();view='closed';mount(`<div class="narrow glass panel center"><div class="waiting-icon">👋</div><h2>${t('closed')}</h2><div class="space-top">${button('home',t('returnHome'),'primary')}</div></div>`);return;}if(role==='host')renderHost(s);else renderPlayer(s);lastPlayerKey=key;updateTimer();const soundKey=s.pin+':'+s.index+':'+s.stage;if(soundKey!==lastSoundKey){lastSoundKey=soundKey;if(s.stage==='results'&&role==='player')sound.play(s.me.answer.correct?'correct':'wrong');if(s.stage==='podium'){sound.play('victory');confetti();}}}
function renderHost(s){let html='';if(s.stage==='lobby'){html=`<div class="page-title"><div><div class="eyebrow">${escapeHTML(s.title)}</div><h2 class="space-top">${t('lobby')}</h2></div>${button('end',t('end'))}</div><section class="glass lobby-panel"><p class="muted">${t('lobbyDesc')}</p><div class="lobby-pin">${s.pin}</div><div class="join-url">${escapeHTML(location.origin)}</div>${button('copy-link',`⧉ ${t('copyLink')}`,'white')}</section><div class="section-title space-top"><h3>${s.players.length} ${t('players')}</h3><div class="toolbar">${button('bot',t('addBot'))}${button('start',`${t('start')} →`,'primary',s.players.length?'':'disabled')}</div></div><p class="muted small" style="margin-bottom:15px">${t('kickHint')}</p><div class="players">${s.players.map(p=>`<button class="player-tile ${p.online?'':'offline'}" data-action="kick" data-id="${p.id}"><span>${p.avatar}</span><b>${escapeHTML(p.name)}</b></button>`).join('')}</div>${s.players.length?'':`<div class="glass empty"><span class="status-dot"></span>${t('waitingPlayers')}</div>`}`;}else if(s.stage==='question'){const q=s.question;html=`${gameTop(s)}<div class="timer"><div id="timer-bar"></div></div><div class="center">${publicQuestion(q)}</div>${q.type==='mcq'?answerTiles(q):`<div class="glass panel center">⌨ ${t('typeAnswer')}</div>`}<div class="game-bottom"><span class="clock" id="clock"></span><span class="received">${s.received} / ${s.players.length} ${t('answersReceived')}</span>${button('reveal',t('reveal'))}</div>`;}else if(s.stage==='results'){const q=s.question;let chart;if(q.type==='mcq'){const counts=[0,0,0,0];s.responses.forEach(a=>counts[a.value]++);const max=Math.max(...counts,1);chart=`<div class="bars">${counts.map((c,i)=>`<div class="bar-wrap"><span class="bar-count">${c}</span><div class="bar color-${i}" style="height:${c/max*115+6}px"></div><span class="bar-label">${shapes[i]} ${i===q.correct?'✓':''}</span></div>`).join('')}</div>`;}else chart=`<div class="response-pills">${s.responses.map(a=>`<div class="response-pill ${a.correct?'yes':''}"><small>${escapeHTML(a.name)}</small><br><b>${escapeHTML(a.value)}</b> ${a.correct?'✓':'×'}</div>`).join('')||t('noResponses')}</div>`;html=`${gameTop(s)}<div class="center"><h2 class="question-text">${escapeHTML(q.text)}</h2>${chart}${correctLine(q)}</div>${q.type==='mcq'?answerTiles(q,false,true):''}${explanation(q)}<div class="game-bottom"><span class="muted small">${s.received} / ${s.players.length} ${t('answersReceived')}</span>${button('leaderboard',`${t('nextScoreboard')} →`,'primary')}</div>`;}else if(s.stage==='leaderboard'){html=`<div class="center"><div class="eyebrow">${escapeHTML(s.title)}</div><h2 class="space-top">${t('scoreboard')}</h2></div>${leaders(s)}<div class="center">${button('next',t(s.index+1===s.total?'showPodium':'nextQuestion')+' →','primary')}</div>`;}else if(s.stage==='podium'){html=`${podium(s)}<div class="center space-top">${button('new-game',t('newGame'),'primary')}</div>`;}mount(html);}
function renderPlayer(s){let html='';const me=s.me;if(s.stage==='lobby'){html=`<div class="narrow glass panel center"><span class="pill"><i class="dot"></i>${t('connected')} · ${s.pin}</span><div class="waiting-icon">${me.avatar}</div><h2 class="name-break">${escapeHTML(me.name)}, ${t('waiting')}</h2><p class="muted space-top">${t('waitingDesc')}</p><p class="small muted space-top">${escapeHTML(s.title)}</p><div class="space-top">${button('leave',t('leave'))}</div></div>`;}else if(s.stage==='question'){const q=s.question;html=`${gameTop(s)}<div class="timer"><div id="timer-bar"></div></div><div class="center"><span class="clock" id="clock"></span><h2 class="question-text">${escapeHTML(q.text)}</h2></div>${me.answered?`<div class="narrow glass panel center"><div class="waiting-icon">✓</div><h2>${t('submitted')}</h2><p class="muted space-top">${t('submittedDesc')}</p></div>`:q.type==='mcq'?answerTiles(q,true):`<form id="open-answer" class="narrow glass panel stack"><label for="answer-text">${t('typeAnswer')}</label><input id="answer-text" autocomplete="off" maxlength="200" required autofocus><button class="btn primary" type="submit">${t('submit')} →</button></form>`}`;}else if(s.stage==='results'){const a=me.answer;html=`<div class="feedback ${a.correct?'':'wrong'}"><div class="feedback-icon">${a.correct?'✓':'↻'}</div><h2>${t(a.correct?'correct':'incorrect')}</h2><div class="points">+${num(a.points)}</div><span>${t('points')}</span><div class="stats"><div><b>${num(me.score)}</b><span>${t('totalScore')}</span></div><div><b>#${me.rank}</b><span>${t('rank')}</span></div><div><b>🔥 ${me.streak}</b><span>${t('streak')}</span></div></div></div><div class="narrow">${correctLine(s.question)}${explanation(s.question)}<p class="center muted small space-top">${t('hostWaiting')}</p></div>`;}else if(s.stage==='leaderboard'){html=`<div class="center"><h2>${t('scoreboard')}</h2><p class="muted space-top">${escapeHTML(me.name)} · #${me.rank} · ${num(me.score)} ${t('points')}</p></div>${leaders(s)}<p class="center muted">${t('ready')}</p>`;}else if(s.stage==='podium'){html=`${podium(s)}<p class="center">${escapeHTML(me.name)} · #${me.rank} · ${num(me.score)} ${t('points')}</p><div class="center space-top">${button('leave',t('returnHome'),'primary')}</div>`;}if(!s.hostOnline)html=`<p class="center muted small">${t('offlineHost')}</p>`+html;mount(html);}
let lastTick='';function updateTimer(){if(!roomState||roomState.stage!=='question')return;const left=Math.max(0,(roomState.deadline-Date.now()-clockOffset)/1000);const bar=$('#timer-bar'),clock=$('#clock');if(bar)bar.style.width=(left/roomState.question.time*100)+'%';if(clock)clock.textContent=Math.ceil(left)+'s';const key=roomState.index+':'+Math.ceil(left);if(left>0&&left<=5&&lastTick!==key){lastTick=key;sound.play('tick');}if(left===0){$$('[data-action="answer"],#open-answer button').forEach(b=>b.disabled=true);}}
setInterval(updateTimer,100);
function showSimulator(){view='simulator';mount(`<div class="page-title"><div><h2>${t('simulator')}</h2><p class="muted small space-top">${t('simDescFull')}</p></div></div><div class="simulator"><div><p class="sim-label">▣ ${t('hostScreen')}</p><iframe title="${t('hostScreen')}" src="/?embed=1&mode=host&lang=${lang}"></iframe></div><div><p class="sim-label">↗ ${t('playerScreen')}</p><iframe title="${t('playerScreen')}" id="player-frame" src="/?embed=1&mode=player&lang=${lang}"></iframe></div></div>`);}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data.type==='quizspark-pin'&&view==='simulator')$('#player-frame')?.contentWindow.postMessage({type:'set-pin',pin:e.data.pin},location.origin);if(e.data.type==='set-pin'&&view==='join'&&$('#player-pin'))$('#player-pin').value=e.data.pin;});
const sound={ctx:null,unlock(){try{this.ctx??=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume();}catch{}},tone(freq,start,duration,type='sine'){if(muted||!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.12,start+.01);g.gain.exponentialRampToValueAtTime(.0001,start+duration);o.connect(g);g.connect(this.ctx.destination);o.start(start);o.stop(start+duration);},play(kind){if(muted||!this.ctx)return;const now=this.ctx.currentTime;const notes={tick:[660],correct:[523,659,784],wrong:[150,110],victory:[523,659,784,1047,784,1047]}[kind];notes?.forEach((f,i)=>this.tone(f,now+i*.13,kind==='tick'?.06:.22,kind==='wrong'?'sawtooth':'sine'));}};
document.addEventListener('pointerdown',()=>sound.unlock(),{once:true});document.addEventListener('keydown',()=>sound.unlock(),{once:true});
let celebration=0;function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;cancelAnimationFrame(celebration);const c=$('#confetti'),ctx=c.getContext('2d');c.hidden=false;c.width=innerWidth;c.height=innerHeight;const pieces=Array.from({length:150},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,w:5+Math.random()*7,v:2+Math.random()*4,drift:Math.random()*2-1,color:['#baff64','#ffcc60','#ff6184','#8fc7ff'][Math.floor(Math.random()*4)]}));let frames=0;function draw(){ctx.clearRect(0,0,c.width,c.height);for(const p of pieces){p.y+=p.v;p.x+=p.drift;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.w,p.w*.6);}if(++frames<350)celebration=requestAnimationFrame(draw);else c.hidden=true;}draw();}
async function navigateHome(){if(dirty&&!confirm(t('confirmDiscard')))return;if(roomState&&roomState.stage!=='closed'&&roomState.stage!=='podium'&&!confirm(t(role==='host'?'endConfirm':'leaveConfirm')))return;if(role==='host')send({action:'close'});dropConnection();dirty=false;showHome();}
async function downloadQuiz(id){const data=await api('/api/quizzes/'+id+'/export');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='quizspark-'+id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function importFile(file){if(!file)return;if(file.size>config.maxImportMB*1024*1024)throw new Error('file_too_large');const data=new FormData();data.append('file',file);const result=await api('/api/import',{method:'POST',body:data});toast(t('importDone',{n:result.count}));await showQuizzes('manager');}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;try{
if(a==='home')await navigateHome();
else if(a==='sound'){muted=!muted;localStorage.setItem('QuizSpark_muted',muted?'1':'0');header();}
else if(a==='language'){lang=lang==='th'?'en':'th';localStorage.setItem('QuizSpark_language',lang);header();if(view==='game')renderGame(true);else if(view==='editor')renderEditor();else if(view==='home')showHome();else if(view==='join'){const pin=$('#player-pin')?.value,name=$('#nickname')?.value;showJoin(pin);$('#nickname').value=name;}else if(view==='simulator'){$('.page-title h2').textContent=t('simulator');$('.page-title p').textContent=t('simDescFull');$$('.simulator iframe').forEach(f=>f.contentWindow.postMessage({type:'language',lang},location.origin));$$('.sim-label').forEach((p,i)=>p.textContent=t(i?'playerScreen':'hostScreen'));}else if(view==='closed')mount(`<div class="narrow glass panel center"><h2>${t('closed')}</h2><div class="space-top">${button('home',t('returnHome'),'primary')}</div></div>`);else await showQuizzes(view==='manager'?'manager':'host');if($('#login-dialog').open)renderLogin();}
else if(a==='host')await showQuizzes();else if(a==='manager')await showQuizzes('manager');else if(a==='join')showJoin();else if(a==='simulator'){if(await ensureAdmin())showSimulator();}
else if(a==='cancel-login')closeLogin(false);else if(a==='new')openEditor();else if(a==='edit')openEditor(el.dataset.id);else if(a==='save')await saveQuiz();
else if(a==='editor-back'){if(!dirty||confirm(t('confirmDiscard'))){dirty=false;await showQuizzes('manager');}}
else if(a==='question-tab'){questionIndex=Number(el.dataset.index);renderEditor();}else if(a==='add-question'){draft.questions.push(newQuestion());questionIndex=draft.questions.length-1;dirty=true;renderEditor();}else if(a==='remove-question'){draft.questions.splice(questionIndex,1);questionIndex=Math.min(questionIndex,draft.questions.length-1);dirty=true;renderEditor();}
else if(a==='delete'&&confirm(t('confirmDelete'))){await api('/api/quizzes/'+el.dataset.id,{method:'DELETE'});toast(t('deleted'));await showQuizzes(view==='manager'?'manager':'host');}
else if(a==='export')await downloadQuiz(el.dataset.id);else if(a==='import')$('#import-file').click();
else if(a==='migrate'){const raw=localStorage.getItem('QuizSpark_quizzes_v3');await importFile(new File([raw],'browser-quizzes.json',{type:'application/json'}));toast(t('migrateDone'));}
else if(a==='avatar'){avatar=el.dataset.avatar;$$('.avatar-btn').forEach(b=>{b.classList.toggle('selected',b===el);b.setAttribute('aria-pressed',b===el?'true':'false');});}
else if(a==='host-quiz'){el.disabled=true;connect({type:'create',quizId:el.dataset.id,adminToken});}
else if(a==='copy-link'){try{await navigator.clipboard.writeText(joinUrl());toast(t('copied'));}catch{prompt(t('copyLink'),joinUrl());}}
else if(['start','reveal','leaderboard','next'].includes(a))send({action:a});else if(a==='bot')send({action:'add_bot'});else if(a==='kick'&&confirm(t('kickConfirm')))send({action:'kick',id:el.dataset.id});
else if(a==='answer'){send({type:'answer',value:Number(el.dataset.index),index:roomState.index});$$('[data-action="answer"]').forEach(b=>b.disabled=true);}
else if(a==='end'&&confirm(t('endConfirm')))send({action:'close'});else if(a==='leave'){if(roomState?.stage==='podium'||confirm(t('leaveConfirm'))){dropConnection();showHome();}}
else if(a==='new-game'){send({action:'close'});dropConnection();await showQuizzes();}
}catch(error){toast(err(error.message));el.disabled=false;}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;try{if(form.id==='quick-join'){showJoin($('#quick-pin').value.trim());}else if(form.id==='player-join'){form.querySelector('button[type="submit"]').disabled=true;connect({type:'join',pin:$('#player-pin').value.trim(),name:$('#nickname').value.trim(),avatar});}else if(form.id==='login-form'){const result=await api('/api/login',{method:'POST',body:{password:$('#host-password').value}});adminToken=result.token;sessionStorage.setItem('QuizSpark_admin',adminToken);closeLogin(true);}else if(form.id==='open-answer'){send({type:'answer',value:$('#answer-text').value.trim(),index:roomState.index});form.querySelector('button').disabled=true;}}catch(error){const out=form.querySelector('.error');if(out)out.textContent=err(error.message);else toast(err(error.message));}});
document.addEventListener('input',e=>{const el=e.target;if(view!=='editor')return;const q=draft.questions[questionIndex];if(el.dataset.draft){draft[el.dataset.draft]=el.value;dirty=true;}else if(el.dataset.field){const key=el.dataset.field;q[key]=key==='time'?Number(el.value):key==='openAnswers'?el.value.split(',').map(x=>x.trim()).filter(Boolean):el.value;dirty=true;}else if(el.dataset.option!==undefined){q.options[Number(el.dataset.option)]=el.value;dirty=true;}else if(el.dataset.correct!==undefined){q.correct=Number(el.dataset.correct);dirty=true;}});
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='import-file'){await importFile(el.files[0]);el.value='';}else if(el.dataset.field==='type'){const q=draft.questions[questionIndex];q.type=el.value;q.options??=['','','',''];q.correct??=0;q.openAnswers??=[];dirty=true;renderEditor();}else if(el.dataset.upload){const file=el.files[0];if(!file)return;if(file.size>config.maxUploadMB*1024*1024)throw new Error('file_too_large');const target=draft.questions[questionIndex],key=el.dataset.upload;el.disabled=true;toast(t('uploading'));const body=new FormData();body.append('file',file);const result=await api('/api/uploads',{method:'POST',body});target[key]=result.url;dirty=true;if(view==='editor')renderEditor();toast(t('uploadDone'));}}catch(error){toast(err(error.message));el.disabled=false;el.value='';}});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.hidden=true;},true);
$('#login-dialog').addEventListener('cancel',e=>{e.preventDefault();closeLogin(false);});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data.type==='language'){lang=e.data.lang;header();if(view==='game')renderGame(true);else if(view==='join'){const pin=$('#player-pin').value,nickname=$('#nickname').value;showJoin(pin);$('#nickname').value=nickname;}else if(view==='editor')renderEditor();else if(view==='host-select'||view==='manager')showQuizzes(view==='manager'?'manager':'host').catch(()=>{});if($('#login-dialog').open)renderLogin();}});
(async()=>{if(['th','en'].includes(params.get('lang')))lang=params.get('lang');header();config=await api('/api/config').catch(()=>config);try{resume=JSON.parse(sessionStorage.getItem(resumeKey));}catch{}if(resume&&params.has('pin')&&params.get('pin')!==resume.pin){resume=null;sessionStorage.removeItem(resumeKey);}if(resume){mount(`<div class="narrow center panel">${t('reconnecting')}</div>`);connect({type:'resume',...resume});}else if(params.has('pin'))showJoin(params.get('pin'));else if(params.get('mode')==='host')await showQuizzes();else if(params.get('mode')==='player')showJoin();else showHome();})().catch(e=>{showHome();toast(err(e.message));});
</script>
</body></html>
