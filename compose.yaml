name: quizspark
services:
  quizspark:
    build: .
    image: quizspark:3.0
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    environment:
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_IMPORT_MB: ${MAX_IMPORT_MB:-50}
      MAX_PLAYERS: ${MAX_PLAYERS:-200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - quizspark_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quizspark_data:
    name: quizspark_data
